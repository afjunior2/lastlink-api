version: '3.8'

services:
  lastlink-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastlink-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/lastlink.db
      - Jwt__SecretKey=your-super-secure-secret-key-with-at-least-32-characters-for-jwt
      - Jwt__Issuer=LastLinkApi
      - Jwt__Audience=LastLinkApi
      - Jwt__ExpirationMinutes=60
    volumes:
      - lastlink-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL for production (optional)
  postgres:
    image: postgres:15-alpine
    container_name: lastlink-postgres
    environment:
      - POSTGRES_DB=lastlink
      - POSTGRES_USER=lastlink
      - POSTGRES_PASSWORD=lastlink123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - production

volumes:
  lastlink-data:
    driver: local
  postgres-data:
    driver: local

networks:
  default:
    name: lastlink-network